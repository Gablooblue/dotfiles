# AeroSpace - i3-style tiling window manager
# Reference: https://nikitabobko.github.io/AeroSpace/guide

config-version = 2
start-at-login = true
automatically-unhide-macos-hidden-apps = true

# Disable normalizations for i3 parity
enable-normalization-flatten-containers = false
enable-normalization-opposite-orientation-for-nested-containers = false

# Mouse follows focus on monitor change
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# Notify sketchybar on focused window change
on-focus-changed = ['exec-and-forget sketchybar --trigger aerospace_focus_change']

# Notify sketchybar on workspace changes so workspace indicators update
exec-on-workspace-change = [
    '/bin/bash',
    '-c',
    'sketchybar --trigger aerospace_workspace_change AEROSPACE_FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE AEROSPACE_PREV_WORKSPACE=$AEROSPACE_PREV_WORKSPACE'
]

# Window borders via JankyBorders
after-startup-command = [
    'exec-and-forget borders active_color=0xffe1e3e4 inactive_color=0xff494d64 width=2.0'
]

# ── Keybindings ──────────────────────────────────────────────

[mode.main.binding]

# Launch terminal
alt-enter = 'exec-and-forget open -n -a "Warp"'

# Focus (wraps around workspace)
alt-h = 'focus --boundaries-action wrap-around-the-workspace left'
alt-j = 'focus --boundaries-action wrap-around-the-workspace down'
alt-k = 'focus --boundaries-action wrap-around-the-workspace up'
alt-l = 'focus --boundaries-action wrap-around-the-workspace right'

# Move windows
alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

# Splits
alt-x = 'split horizontal'
alt-v = 'split vertical'

# Layout
alt-f = 'fullscreen'
alt-s = 'layout v_accordion'
alt-w = 'layout h_accordion'
alt-e = 'layout tiles horizontal vertical'
alt-shift-space = 'layout floating tiling'
alt-shift-e = 'balance-sizes'

# Workspaces
alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-6 = 'workspace 6'
alt-7 = 'workspace 7'
alt-8 = 'workspace 8'
alt-9 = 'workspace 9'
alt-0 = 'workspace 10'

# Move window to workspace (and follow it)
alt-shift-1 = ['move-node-to-workspace 1', 'workspace 1']
alt-shift-2 = ['move-node-to-workspace 2', 'workspace 2']
alt-shift-3 = ['move-node-to-workspace 3', 'workspace 3']
alt-shift-4 = ['move-node-to-workspace 4', 'workspace 4']
alt-shift-5 = ['move-node-to-workspace 5', 'workspace 5']
alt-shift-6 = ['move-node-to-workspace 6', 'workspace 6']
alt-shift-7 = ['move-node-to-workspace 7', 'workspace 7']
alt-shift-8 = ['move-node-to-workspace 8', 'workspace 8']
alt-shift-9 = ['move-node-to-workspace 9', 'workspace 9']
alt-shift-0 = ['move-node-to-workspace 10', 'workspace 10']

# Utilities
alt-shift-c = 'reload-config'
alt-shift-s = 'move-node-to-monitor --wrap-around next'
alt-shift-q = 'close'
alt-d = 'exec-and-forget open -n /System/Applications/Launchpad.app'
alt-r = 'mode resize'
alt-tab = 'workspace-back-and-forth'

[mode.resize.binding]
h = 'resize width -50'
j = 'resize height +50'
k = 'resize height -50'
l = 'resize width +50'
shift-h = 'resize width -200'
shift-j = 'resize height +200'
shift-k = 'resize height -200'
shift-l = 'resize width +200'
enter = 'mode main'
esc = 'mode main'

# ── Gaps ─────────────────────────────────────────────────────

[gaps]
inner.horizontal = 8
inner.vertical = 8
outer.left = 8
outer.right = 8
outer.top = 8
outer.bottom = 36    # 28px sketchybar + 8px gap

# ── Monitor assignments ──────────────────────────────────────

[workspace-to-monitor-force-assignment]
1 = 'main'
2 = 'main'
3 = 'main'
4 = ['main', 'secondary']
5 = ['main', 'secondary']
6 = ['main', 'secondary']
7 = ['main', 'secondary']
8 = ['main', 'secondary']
9 = ['main', 'secondary']
10 = ['main', 'secondary']

# ── Window rules ─────────────────────────────────────────────

# Slack -> workspace 1
[[on-window-detected]]
if.app-id = 'com.tinyspeck.slackmacgap'
run = 'move-node-to-workspace 1'

# Browsers -> workspace 2
[[on-window-detected]]
if.app-id = 'com.apple.Safari'
run = 'move-node-to-workspace 2'

[[on-window-detected]]
if.app-id = 'com.google.Chrome'
run = 'move-node-to-workspace 2'

[[on-window-detected]]
if.app-id = 'company.thebrowser.Browser'
run = 'move-node-to-workspace 2'

# Terminal -> workspace 3
[[on-window-detected]]
if.app-id = 'dev.warp.Warp-Stable'
run = 'move-node-to-workspace 3'

# Editors -> workspace 4
[[on-window-detected]]
if.app-id = 'com.microsoft.VSCode'
run = 'move-node-to-workspace 4'

[[on-window-detected]]
if.app-id = 'com.todesktop.230313mzl4w4u92'
run = 'move-node-to-workspace 4'

[[on-window-detected]]
if.app-id = 'com.neovide.neovide'
run = 'move-node-to-workspace 4'

# Conductor -> workspace 5
[[on-window-detected]]
if.app-id = 'com.conductor.app'
run = 'move-node-to-workspace 5'

# Claude Code -> workspace 6
[[on-window-detected]]
if.app-id = 'com.anthropic.claudefordesktop'
run = 'move-node-to-workspace 6'

# Beekeeper Studio -> workspace 7
[[on-window-detected]]
if.app-id = 'io.beekeeperstudio.desktop'
run = 'move-node-to-workspace 7'

# Zoom -> workspace 8
[[on-window-detected]]
if.app-id = 'us.zoom.xos'
run = 'move-node-to-workspace 8'

# Music -> workspace 10
[[on-window-detected]]
if.app-id = 'com.spotify.client'
run = 'move-node-to-workspace 10'

# Float utility windows
[[on-window-detected]]
if.app-id = 'com.apple.systempreferences'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.ActivityMonitor'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.calculator'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.finder'
run = 'layout floating'
